name: generate-3d-contrib

on:
  schedule:
    - cron: "0 18 * * *"   # runs every day at 18:00 UTC — keeps the graph current
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main                # also regenerates on every push to main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git commit -m "chore: refresh 3d contribution graph" || echo "no changes to commit"
          git push
